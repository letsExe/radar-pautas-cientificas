name: Manter o banco acordado

on:
  schedule:
    - cron: "17 9 * * *" # todo dia às 09:17 UTC (06:17 em Brasília)
  workflow_dispatch: # permite rodar na mão, pela aba Actions

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" 
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.keepalive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}